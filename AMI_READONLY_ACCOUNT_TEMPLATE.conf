; Asterisk 20 / Issabel — OPTIONAL new AMI account in manager_custom.conf
; Copy just this section into /etc/asterisk/manager_custom.conf,
; ONLY AFTER checking manager.conf actually includes manager_custom.conf.
; Choose a LONG random secret LOCALLY. NEVER share it in chat/GitHub.
; Access only through localhost via SSH tunnel; no public AMI binding required.
[sq_readonly]
secret = REPLACE_WITH_RANDOM_SECRET_LOCALLY
; Asterisk manager ACL uses netmask notation
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
read = agent,call
write =
