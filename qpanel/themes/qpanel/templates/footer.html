        <div class="container-fluid">
          <span><strong>صانع · SaneQueue</strong> — {{ 'مانیتورینگ صف تماس' if ui_language == 'fa' else 'Call queue monitoring' }}</span>
          <span class="sane-credits">{{ 'مبتنی بر' if ui_language == 'fa' else 'Based on' }}
          <a href="https://github.com/roramirez/qpanel" target="_blank" rel="noopener">QPanel</a> ·
          <a href="https://github.com/mrsane" target="_blank" rel="noopener">mrsane</a></span>

      <script src="{{ url_for('static', filename='components/js-cookie/src/js.cookie.js') }}"></script>
      <script>
        document.addEventListener('DOMContentLoaded', function() {
        var config_check_update = {{ check_upgrade()|lower}};
        if (config_check_update) {
          if (typeof Cookies.get('check_version') === "undefined") {

            var rversion = $.ajax({
                type: 'GET',
                url: '{{ url_for('.check_new_version') }}'
            });
            rversion.done(function (response) {
                if (response) {
                    if (response.require_upgrade) {
                        showPopupUpdate(response.last_stable_version);
                    }
                    if (response.update_check_available !== false) {
                        Cookies.set('check_version', '1', { expires: 30 });
                    }
                }
            });
            rversion.fail(function (response) {
                Cookies.set('check_version', '1', { expires: 1 });
            });
          }
        }
        }, false);

        function showPopupUpdate(actual_version) {
           var title = {{ _('New version available')|tojson }};
           var message = {{ _('Exist a new version stable: ')|tojson }} + actual_version + {{ _('. Visit and update your QPanel <a href="https://github.com/roramirez/qpanel" target="_blank" style="color:#ffd777">from GitHub</a>.')|tojson }};

          $.notify({
            icon: "cloud_download",
            message: message

          }, {
            type: 'primary',
            timer: 3000,
            placement: {
            from: 'top',
            align: 'right'
          }
        });
      }
      </script>
