name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SANEQUEUE_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements/modern.txt -r requirements/reporting.txt pytest httpx2
      - run: pybabel compile -d qpanel/translations
      - run: python -m pytest tests --ignore=tests/historical
      - run: node --check qpanel/themes/qpanel/static/js/operations.js
      - run: node --check qpanel/themes/qpanel/static/js/context-help.js
      - run: node --check qpanel/themes/qpanel/static/js/planning.js
      - run: node --check qpanel/themes/qpanel/static/js/activity.js
      - run: node --check qpanel/themes/qpanel/static/js/organization.js
      - run: node --check qpanel/themes/qpanel/static/js/telephony.js
      - run: node --check qpanel/themes/qpanel/static/js/reports.js
      - run: node --check qpanel/themes/qpanel/static/js/report-analytics.js
      - run: node --check qpanel/themes/qpanel/static/js/report-exports.js
      - run: node --check qpanel/themes/qpanel/static/js/recording-audit.js
      - run: node --check qpanel/themes/qpanel/static/js/work-reports.js
      - run: node --check qpanel/themes/qpanel/static/js/report-plans.js
      - run: node --check qpanel/themes/qpanel/static/js/shift-reports.js
      - run: node --check qpanel/themes/qpanel/static/js/cdr-reports.js
      - run: node --check qpanel/themes/qpanel/static/js/journey-reports.js
      - run: node --check qpanel/themes/qpanel/static/js/quality-reports.js
      - run: node --check qpanel/themes/qpanel/static/js/ai-reports.js
      - run: node --check qpanel/themes/qpanel/static/js/transcript-search.js
      - run: node --check qpanel/themes/qpanel/static/js/report-builder.js
      - run: node --check qpanel/themes/qpanel/static/js/followup-reports.js
      - run: node --check qpanel/themes/qpanel/static/js/agent-metrics-reports.js
      - run: node tests/reporting_frontend.cjs
      - run: node tests/report_builder_frontend.cjs
      - run: node tests/surveys_frontend.cjs
      - run: node --check qpanel/themes/qpanel/static/js/navigation.js
      - run: node --check qpanel/themes/qpanel/static/js/incident-notices.js
      - run: node tests/incident_frontend.cjs
