name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements/modern.txt pytest
      - run: pybabel compile -d qpanel/translations
      - run: python -m pytest tests --ignore=tests/historical
      - run: node --check qpanel/themes/qpanel/static/js/operations.js
      - run: node --check qpanel/themes/qpanel/static/js/planning.js
