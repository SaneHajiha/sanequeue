name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SANEQUEUE_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements/modern.txt pytest httpx2
      - run: pybabel compile -d qpanel/translations
      - run: python -m pytest tests --ignore=tests/historical
      - run: node --check qpanel/themes/qpanel/static/js/operations.js
      - run: node --check qpanel/themes/qpanel/static/js/planning.js
      - run: node --check qpanel/themes/qpanel/static/js/activity.js
      - run: node --check qpanel/themes/qpanel/static/js/organization.js
      - run: node --check qpanel/themes/qpanel/static/js/telephony.js
      - run: node --check qpanel/themes/qpanel/static/js/reports.js
