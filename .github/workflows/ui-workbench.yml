name: UI workbench
on:
  push:
    paths: ['tools/ui-workbench/**', 'qpanel/themes/qpanel/static/**', '.github/workflows/ui-workbench.yml']
  pull_request:
    paths: ['tools/ui-workbench/**', 'qpanel/themes/qpanel/static/**', '.github/workflows/ui-workbench.yml']
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UI_SKIP_VISUAL: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/ui-workbench/package-lock.json
      - run: npm ci --prefix tools/ui-workbench
      - run: node tools/ui-workbench/node_modules/@playwright/test/cli.js install --with-deps chromium --only-shell
      - run: npm run build --prefix tools/ui-workbench
      - run: npm run build-storybook --prefix tools/ui-workbench
      - run: npm test --prefix tools/ui-workbench
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ui-workbench-evidence
          path: |
            tools/ui-workbench/playwright-report/
            tools/ui-workbench/test-results/
          retention-days: 7
